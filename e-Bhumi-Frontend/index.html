<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123d35" />
  <meta name="description" content="e-Bhumi — Bangladesh land services workspace demo frontend." />
  <title>e-Bhumi | Land Services Workspace</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" data-page="dashboard" aria-label="e-Bhumi home">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 23 20 7l15 16-15 10L5 23Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 25 20 18l10 7M14 28v5m12-5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="13" r="2" fill="currentColor"/></svg></span>
        <span class="brand-copy"><strong>e-Bhumi</strong><small>LAND SERVICES PLATFORM</small></span>
      </a>
      <div class="workspace-switch" data-action="workspace-switch" role="button" tabindex="0" aria-label="Switch workspace"><span class="workspace-icon">⌂</span><span><b>Citizen Workspace</b><small>Bangladesh · Demo mode</small></span><span class="chevron">⌄</span></div>
      <div class="side-label">WORKSPACE</div>
      <nav class="nav-list" id="mainNav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">?</div><div><b>Need assistance?</b><small>Explore services and guides</small><button class="text-button" data-action="help">Visit Help Centre ↗</button></div></div>
        <div class="profile-mini"><div class="avatar">EB</div><div class="profile-text"><b>Citizen Account</b><small>Citizen account · Demo</small></div><button class="icon-button" aria-label="Profile menu" data-action="profile">•••</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><b id="crumbCurrent">Overview</b></div>
        <div class="top-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search land, services, applications…" aria-label="Search everything"/><kbd>⌘ K</kbd></label>
          <button class="language-toggle" id="languageToggle" aria-label="Switch language">বাংলা <span>⌄</span></button>
          <button class="icon-button notification-button" data-action="notifications" aria-label="Notifications">♧<i></i></button>
          <button class="top-avatar" data-action="profile" aria-label="Citizen profile" title="Profile menu">EB</button>
        </div>
      </header>
      <section class="page-wrap" id="pageContent" aria-live="polite"></section>
      <footer class="app-footer"><span>e-Bhumi · Citizen Land Services Workspace</span><span><span class="status-dot"></span> Demo environment <span class="footer-sep">·</span> v0.1.0</span></footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="eyebrow" id="modalEyebrow">QUICK ACTION</span><h2 id="modalTitle">Create request</h2></div><button class="icon-button" data-action="close-modal" aria-label="Close dialog">✕</button></div><div id="modalBody"></div></section></div>
  <script src="app.js" defer></script>
</body>
</html>
